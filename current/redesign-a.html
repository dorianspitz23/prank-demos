<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Option A — Stats-Forward</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: #1a1a1a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }

  .section { background: #2D2D2D; width: 100%; padding: 80px 24px; }
  .inner { max-width: 960px; margin: 0 auto; text-align: center; }

  /* Kicker quote */
  .kicker-quote {
    font-size: 18px;
    font-style: italic;
    color: rgba(255,255,255,0.6);
    margin-bottom: 12px;
    font-weight: 400;
  }
  .kicker-attr {
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    margin-bottom: 56px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* Stats grid */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 32px;
    max-width: 720px;
    margin: 0 auto;
  }
  .stat-card {
    position: relative;
    padding: 32px 16px;
    border-radius: 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    transition: transform 0.2s, background 0.2s;
  }
  .stat-card:hover {
    transform: translateY(-4px);
    background: rgba(255,255,255,0.07);
  }
  .stat-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
  }
  .stat-icon.terracotta { background: rgba(212,113,78,0.15); color: #D4714E; }
  .stat-icon.gold { background: rgba(224,166,68,0.15); color: #E0A644; }
  .stat-icon.green { background: rgba(91,140,90,0.15); color: #5B8C5A; }

  .stat-number {
    font-size: 48px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
    margin-bottom: 8px;
  }
  .stat-label {
    font-size: 14px;
    color: rgba(255,255,255,0.5);
    font-weight: 500;
  }

  @media (max-width: 640px) {
    .stats-grid { grid-template-columns: 1fr; gap: 16px; max-width: 280px; }
    .stat-number { font-size: 40px; }
    .section { padding: 56px 20px; }
  }
</style>
</head>
<body>
  <div class="section">
    <div class="inner">
      <p class="kicker-quote">"I've been giggling about this for days."</p>
      <p class="kicker-attr">Most common review theme on Amazon</p>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon terracotta">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg>
          </div>
          <div class="stat-number">1,000+</div>
          <div class="stat-label">pranks shipped</div>
        </div>

        <div class="stat-card">
          <div class="stat-icon gold">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </div>
          <div class="stat-number">4.5/5</div>
          <div class="stat-label">rated on Amazon</div>
        </div>

        <div class="stat-card">
          <div class="stat-icon green">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          </div>
          <div class="stat-number">60-day</div>
          <div class="stat-label">free returns</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
