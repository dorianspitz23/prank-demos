<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Option C — Confidence Strip</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: #1a1a1a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }

  .section { background: #2D2D2D; width: 100%; padding: 56px 24px; }
  .inner {
    max-width: 1060px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 64px;
    align-items: center;
  }

  /* Left: Quote */
  .quote-side { position: relative; }
  .deco-quote {
    font-size: 120px;
    font-weight: 700;
    color: #D4714E;
    opacity: 0.15;
    line-height: 0.7;
    position: absolute;
    top: -20px;
    left: -10px;
    user-select: none;
  }
  .quote-text {
    font-size: 22px;
    font-weight: 500;
    color: #fff;
    line-height: 1.5;
    font-style: italic;
    position: relative;
    z-index: 1;
  }
  .quote-attr {
    margin-top: 16px;
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .quote-attr .divider {
    width: 24px;
    height: 1px;
    background: rgba(255,255,255,0.2);
  }

  /* Right: Stats stack */
  .stats-stack { display: flex; flex-direction: column; gap: 24px; }
  .stat-row {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 20px 24px;
    border-radius: 12px;
    background: rgba(255,255,255,0.03);
    border-left: 3px solid transparent;
    transition: background 0.2s, border-color 0.2s;
  }
  .stat-row:hover {
    background: rgba(255,255,255,0.06);
  }
  .stat-row.terracotta { border-left-color: #D4714E; }
  .stat-row.gold { border-left-color: #E0A644; }
  .stat-row.green { border-left-color: #5B8C5A; }

  .stat-row .icon {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stat-row.terracotta .icon { color: #D4714E; }
  .stat-row.gold .icon { color: #E0A644; }
  .stat-row.green .icon { color: #5B8C5A; }

  .stat-row .stat-info {}
  .stat-row .stat-number {
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    line-height: 1.1;
  }
  .stat-row .stat-label {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    font-weight: 400;
    margin-top: 2px;
  }

  @media (max-width: 768px) {
    .inner {
      grid-template-columns: 1fr;
      gap: 40px;
      text-align: center;
    }
    .deco-quote { position: static; font-size: 80px; line-height: 0.5; margin-bottom: 12px; opacity: 0.12; }
    .quote-attr { justify-content: center; }
    .section { padding: 48px 20px; }
  }
</style>
</head>
<body>
  <div class="section">
    <div class="inner">
      <div class="quote-side">
        <span class="deco-quote">&ldquo;</span>
        <p class="quote-text">I've been giggling about this for days. My buddy had to sign for it at work and his face was priceless.</p>
        <div class="quote-attr">
          <span class="divider"></span>
          Most common review theme on Amazon
        </div>
      </div>

      <div class="stats-stack">
        <div class="stat-row terracotta">
          <div class="icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg>
          </div>
          <div class="stat-info">
            <div class="stat-number">1,000+</div>
            <div class="stat-label">pranks shipped</div>
          </div>
        </div>

        <div class="stat-row gold">
          <div class="icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </div>
          <div class="stat-info">
            <div class="stat-number">4.5 / 5</div>
            <div class="stat-label">rated on Amazon</div>
          </div>
        </div>

        <div class="stat-row green">
          <div class="icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          </div>
          <div class="stat-info">
            <div class="stat-number">60-day</div>
            <div class="stat-label">free returns, no questions asked</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
