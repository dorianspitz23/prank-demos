<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Package Deal — Pranks, Handled with Chaos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ================================================================
   RESET & FOUNDATIONS
   ================================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --white: #FFFFFF;
  --dark: #1A1A1A;
  --dark-alt: #222222;
  --terracotta: #D4714E;
  --terracotta-hover: #C0613F;
  --terracotta-active: #ad5a38;
  --warning: #E0A644;
  --chaos-red: #DC2626;
  --chaos-pink: #9F1239;
  --amber: #F59E0B;
  --yellow: #FBBF24;
  --success: #5B8C5A;
  --purple: #7C3AED;
  --font-body: 'DM Sans', system-ui, sans-serif;
  --font-bold: 'Outfit', system-ui, sans-serif;
  --shadow-terracotta: 0 0 30px rgba(212,113,78,0.4), 0 0 60px rgba(212,113,78,0.15);
  --shadow-card: 0 8px 32px rgba(0,0,0,0.4);
  --glass-bg: rgba(255,255,255,0.06);
  --glass-border: rgba(255,255,255,0.08);
  --glass-bg-hover: rgba(255,255,255,0.1);
  --radius: 1rem;
  --radius-pill: 100px;
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  color: rgba(255,255,255,0.7);
  background: linear-gradient(160deg, #1A1A1A 0%, #2D1B14 30%, #3D1515 60%, #1A1A1A 100%);
  background-attachment: fixed;
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
}

img { display: block; max-width: 100%; height: auto; }
a { color: inherit; text-decoration: none; }
button { cursor: pointer; border: none; background: none; font-family: inherit; }
ul, ol { list-style: none; }

/* ================================================================
   LAYOUT
   ================================================================ */
.container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 1.5rem;
}

.section {
  position: relative;
  padding: 5rem 0;
  overflow: hidden;
}
.section--tight { padding: 3rem 0; }
.section--hero { padding: 0; min-height: 100vh; display: flex; align-items: center; }

/* ================================================================
   DIAGONAL STRIPE OVERLAY (global)
   ================================================================ */
#app::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    -45deg,
    transparent,
    transparent 40px,
    rgba(255,255,255,0.015) 40px,
    rgba(255,255,255,0.015) 42px
  );
  pointer-events: none;
  z-index: 0;
}

#app > * { position: relative; z-index: 1; }

/* ================================================================
   CONFETTI (35 particles, fixed, CSS-only)
   ================================================================ */
.confetti-container {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  overflow: hidden;
}

.confetti-particle {
  position: absolute;
  width: 8px;
  height: 8px;
  opacity: 0.6;
  animation: confettiFall linear infinite;
}

@keyframes confettiFall {
  0% { transform: translateY(-20px) rotate(0deg); opacity: 0.7; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

/* ================================================================
   TYPOGRAPHY
   ================================================================ */
.headline {
  font-family: var(--font-bold);
  font-weight: 900;
  color: var(--white);
  line-height: 1.05;
  text-shadow: 2px 4px 20px rgba(0,0,0,0.5);
}

.headline--hero {
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  transform: rotate(-1.5deg);
}

.headline--section {
  font-size: clamp(1.75rem, 4vw, 3rem);
  transform: rotate(-1.5deg);
}

.headline--card {
  font-size: clamp(1.25rem, 2.5vw, 1.75rem);
  transform: rotate(-0.5deg);
}

.kicker {
  font-family: var(--font-bold);
  font-weight: 700;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--chaos-red);
  animation: glitch 3s infinite;
  display: inline-block;
  margin-bottom: 0.75rem;
}

@keyframes glitch {
  0%, 90%, 100% { transform: translate(0); }
  92% { transform: translate(-2px, 1px); }
  94% { transform: translate(2px, -1px); }
  96% { transform: translate(-1px, -1px); }
  98% { transform: translate(1px, 1px); }
}

.body-text { color: rgba(255,255,255,0.6); line-height: 1.7; }
.body-text--bright { color: rgba(255,255,255,0.85); }

/* ================================================================
   GLASS CARDS
   ================================================================ */
.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.glass--hover:hover {
  background: var(--glass-bg-hover);
  transform: rotate(0deg) translateY(-4px);
  box-shadow: 0 12px 40px rgba(212,113,78,0.2);
  border-color: rgba(212,113,78,0.3);
}

.glass--rotated { transform: rotate(-0.75deg); }
.glass--rotated-alt { transform: rotate(0.5deg); }

/* ================================================================
   BUTTONS
   ================================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 1rem 2rem;
  border-radius: var(--radius-pill);
  font-family: var(--font-bold);
  font-weight: 700;
  font-size: 0.95rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  transition: all 0.3s ease;
  white-space: nowrap;
}

.btn--primary {
  background: linear-gradient(135deg, var(--terracotta), var(--chaos-red));
  color: var(--white);
  box-shadow: 0 0 20px rgba(212,113,78,0.4);
  animation: ctaPulse 2.5s ease-in-out infinite;
}

.btn--primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 40px rgba(212,113,78,0.6);
}

.btn--secondary {
  background: rgba(255,255,255,0.08);
  color: var(--white);
  border: 1px solid rgba(255,255,255,0.2);
}
.btn--secondary:hover {
  background: rgba(255,255,255,0.15);
  border-color: rgba(255,255,255,0.3);
}

.btn--small { padding: 0.6rem 1.5rem; font-size: 0.8rem; }
.btn--large { padding: 1.2rem 2.5rem; font-size: 1.05rem; }

@keyframes ctaPulse {
  0%, 100% { box-shadow: 0 0 20px rgba(212,113,78,0.4); }
  50% { box-shadow: 0 0 40px rgba(212,113,78,0.7), 0 0 60px rgba(220,38,38,0.3); }
}

/* ================================================================
   SCROLL REVEAL
   ================================================================ */
.reveal {
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.reveal.is-visible {
  opacity: 1;
  transform: translateY(0);
}

/* ================================================================
   ANNOUNCEMENT BAR
   ================================================================ */
.announcement-bar {
  background: linear-gradient(90deg, var(--chaos-red), var(--terracotta), var(--chaos-red));
  padding: 0.6rem 0;
  overflow: hidden;
  position: sticky;
  top: 0;
  z-index: 100;
}

.marquee-track {
  display: flex;
  animation: marqueeScroll 20s linear infinite;
  width: max-content;
}

.marquee-track span {
  font-family: var(--font-bold);
  font-weight: 600;
  font-size: 0.8rem;
  color: var(--white);
  text-transform: uppercase;
  letter-spacing: 0.15em;
  padding: 0 2rem;
  white-space: nowrap;
}

@keyframes marqueeScroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* ================================================================
   HEADER / NAV
   ================================================================ */
.site-header {
  padding: 1rem 0;
  position: relative;
  z-index: 50;
}

.site-header .container {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-family: var(--font-bold);
  font-weight: 900;
  font-size: 1.5rem;
  color: var(--white);
  cursor: pointer;
}

.logo em {
  font-style: normal;
  color: var(--terracotta);
}

.nav-links {
  display: flex;
  gap: 2rem;
  align-items: center;
}

.nav-links a {
  font-family: var(--font-bold);
  font-weight: 500;
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: rgba(255,255,255,0.6);
  transition: color 0.3s;
}
.nav-links a:hover { color: var(--white); }

@media (max-width: 768px) {
  .nav-links a { display: none; }
  .nav-links { gap: 0; }
}

/* ================================================================
   HERO
   ================================================================ */
.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  padding: 4rem 0;
}

.hero__grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3rem;
  align-items: center;
}

.hero__stars {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 1.5rem;
}

.hero__stars .stars { color: var(--amber); font-size: 1.1rem; }
.hero__stars .rating {
  color: rgba(255,255,255,0.7);
  font-size: 0.85rem;
}

.hero__sub {
  font-size: clamp(1rem, 1.5vw, 1.25rem);
  color: rgba(255,255,255,0.6);
  margin: 1.5rem 0 2rem;
  max-width: 500px;
}

.hero__ctas {
  display: flex;
  gap: 1rem;
  margin-bottom: 2.5rem;
  flex-wrap: wrap;
}

.hero__benefits {
  display: flex;
  gap: 2rem;
  flex-wrap: wrap;
}

.hero__benefit {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.85rem;
  color: rgba(255,255,255,0.5);
}

.hero__benefit svg { width: 18px; height: 18px; stroke: var(--terracotta); fill: none; stroke-width: 2; }

.hero__image {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero__image img {
  width: 100%;
  max-width: 560px;
  border-radius: var(--radius);
  mask-image: linear-gradient(to left, black 60%, transparent);
  -webkit-mask-image: linear-gradient(to left, black 60%, transparent);
}

@media (max-width: 768px) {
  .hero__grid { grid-template-columns: 1fr; text-align: center; }
  .hero__sub { margin-left: auto; margin-right: auto; }
  .hero__ctas { justify-content: center; }
  .hero__benefits { justify-content: center; }
  .hero__image { order: -1; }
  .hero__image img {
    mask-image: none;
    -webkit-mask-image: none;
    max-width: 400px;
  }
}

/* ================================================================
   STAT COUNTERS
   ================================================================ */
.stats-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1.5rem;
}

.stat-card {
  text-align: center;
  padding: 2rem 1rem;
}

.stat-card__value {
  font-family: var(--font-bold);
  font-weight: 900;
  font-size: clamp(2rem, 4vw, 3rem);
  color: var(--terracotta);
  line-height: 1;
  margin-bottom: 0.5rem;
}

.stat-card__label {
  font-size: 0.85rem;
  color: rgba(255,255,255,0.5);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

@media (max-width: 768px) {
  .stats-strip { grid-template-columns: repeat(2, 1fr); }
}

/* ================================================================
   CATEGORY SHOWCASE
   ================================================================ */
.category-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1.5rem;
}

.category-card {
  padding: 2rem;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.category-card__image {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 0.75rem;
  margin-bottom: 1.25rem;
}

.category-card__title {
  font-family: var(--font-bold);
  font-weight: 800;
  font-size: 1.25rem;
  color: var(--white);
  margin-bottom: 0.25rem;
}

.category-card__count {
  font-size: 0.85rem;
  color: rgba(255,255,255,0.5);
}

.flagship-card {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
  align-items: center;
  padding: 2.5rem;
}

.flagship-card__image {
  width: 100%;
  border-radius: var(--radius);
  aspect-ratio: 4/3;
  object-fit: cover;
}

.flagship-card__badge {
  display: inline-block;
  background: var(--chaos-red);
  color: var(--white);
  font-family: var(--font-bold);
  font-weight: 700;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  padding: 0.3rem 0.8rem;
  border-radius: var(--radius-pill);
  margin-bottom: 0.75rem;
}

.flagship-card__price {
  font-family: var(--font-bold);
  font-weight: 700;
  color: var(--terracotta);
  font-size: 1.5rem;
  margin: 0.75rem 0 1rem;
}

@media (max-width: 768px) {
  .category-grid { grid-template-columns: 1fr; }
  .flagship-card { grid-template-columns: 1fr; }
}

/* ================================================================
   SOCIAL PROOF / TESTIMONIALS
   ================================================================ */
.testimonials-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1.5rem;
}

.testimonial-card {
  padding: 2rem;
}

.testimonial-card__stars {
  color: var(--amber);
  font-size: 0.9rem;
  margin-bottom: 1rem;
}

.testimonial-card__quote {
  font-size: 1.05rem;
  color: rgba(255,255,255,0.8);
  font-style: italic;
  margin-bottom: 1.25rem;
  line-height: 1.7;
}

.testimonial-card__name {
  font-family: var(--font-bold);
  font-weight: 600;
  font-size: 0.85rem;
  color: rgba(255,255,255,0.5);
}

@media (max-width: 768px) {
  .testimonials-grid { grid-template-columns: 1fr; }
}

/* ================================================================
   HOW IT WORKS
   ================================================================ */
.steps-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2rem;
}

.step-card {
  text-align: center;
  padding: 2.5rem 1.5rem;
  position: relative;
}

.step-card__number {
  font-family: var(--font-bold);
  font-weight: 900;
  font-size: 3rem;
  color: rgba(212,113,78,0.15);
  line-height: 1;
  margin-bottom: 1rem;
}

.step-card__icon {
  font-size: 2.5rem;
  margin-bottom: 1rem;
}

.step-card__title {
  font-family: var(--font-bold);
  font-weight: 700;
  font-size: 1.1rem;
  color: var(--white);
  margin-bottom: 0.5rem;
}

.step-card__desc {
  font-size: 0.9rem;
  color: rgba(255,255,255,0.5);
}

@media (max-width: 768px) {
  .steps-grid { grid-template-columns: 1fr; }
}

/* ================================================================
   BENEFITS STRIP
   ================================================================ */
.benefits-strip {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  justify-content: center;
}

.benefit-badge {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.75rem 1.25rem;
  font-size: 0.8rem;
  color: rgba(255,255,255,0.7);
  font-weight: 500;
}

.benefit-badge svg { width: 18px; height: 18px; stroke: var(--terracotta); fill: none; stroke-width: 2; }

/* ================================================================
   DIFFERENTIATORS (SPLIT)
   ================================================================ */
.diff-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3rem;
  align-items: center;
}

.diff-mini-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin: 1.5rem 0 2rem;
}

.diff-mini-card {
  padding: 1.25rem;
}

.diff-mini-card__icon { font-size: 1.5rem; margin-bottom: 0.5rem; }

.diff-mini-card__title {
  font-family: var(--font-bold);
  font-weight: 700;
  font-size: 0.9rem;
  color: var(--white);
  margin-bottom: 0.25rem;
}

.diff-mini-card__desc {
  font-size: 0.8rem;
  color: rgba(255,255,255,0.5);
}

.diff-image {
  width: 100%;
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
}

@media (max-width: 768px) {
  .diff-split { grid-template-columns: 1fr; }
}

/* ================================================================
   TRUST STRIP
   ================================================================ */
.trust-strip {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2.5rem;
  flex-wrap: wrap;
  padding: 2rem 0;
}

.trust-strip__item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.9rem;
  color: rgba(255,255,255,0.6);
}

.trust-strip__item .stars { color: var(--amber); }

/* ================================================================
   DIFFERENTIATOR GRID + GUARANTEE
   ================================================================ */
.diff-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.5rem;
}

.diff-card {
  padding: 2rem;
  text-align: center;
}

.diff-card__icon { font-size: 2rem; margin-bottom: 1rem; }

.diff-card__title {
  font-family: var(--font-bold);
  font-weight: 700;
  font-size: 1rem;
  color: var(--white);
  margin-bottom: 0.5rem;
}

.diff-card__desc {
  font-size: 0.85rem;
  color: rgba(255,255,255,0.5);
}

.guarantee-section {
  margin-top: 3rem;
  text-align: center;
  padding: 3rem;
  border: 2px solid rgba(212,113,78,0.3);
}

.guarantee-section__icon { font-size: 3rem; margin-bottom: 1rem; }

@media (max-width: 768px) {
  .diff-grid { grid-template-columns: 1fr; }
}

/* ================================================================
   FAQ ACCORDION
   ================================================================ */
.faq-list {
  max-width: 720px;
  margin: 0 auto;
}

.faq-item {
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.faq-item__question {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 1.25rem 0;
  font-family: var(--font-bold);
  font-weight: 600;
  font-size: 1rem;
  color: var(--white);
  text-align: left;
  background: none;
  border: none;
  cursor: pointer;
  transition: color 0.3s;
}

.faq-item__question:hover { color: var(--terracotta); }

.faq-item__icon {
  font-size: 1.25rem;
  transition: transform 0.3s;
  color: var(--terracotta);
}

.faq-item.open .faq-item__icon { transform: rotate(45deg); }

.faq-item__answer {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease, padding 0.3s ease;
}

.faq-item.open .faq-item__answer {
  max-height: 300px;
  padding-bottom: 1.25rem;
}

.faq-item__answer p {
  font-size: 0.9rem;
  color: rgba(255,255,255,0.55);
  line-height: 1.7;
}

/* ================================================================
   BUNDLE OFFERS
   ================================================================ */
.bundles-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1.5rem;
}

.bundle-card {
  padding: 2.5rem;
}

.bundle-card--full {
  background: linear-gradient(135deg, rgba(212,113,78,0.15), rgba(220,38,38,0.1));
  border-color: rgba(212,113,78,0.3);
}

.bundle-cards-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
}

@media (max-width: 768px) {
  .bundle-cards-row { grid-template-columns: 1fr; }
}

/* ================================================================
   RECIPIENTS + FINAL CTA
   ================================================================ */
.recipients-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3rem;
  align-items: start;
}

.recipients-left {
  position: sticky;
  top: 6rem;
}

.recipient-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 1.5rem;
}

.recipient-tab {
  padding: 0.5rem 1rem;
  border-radius: var(--radius-pill);
  font-family: var(--font-bold);
  font-weight: 600;
  font-size: 0.8rem;
  color: rgba(255,255,255,0.5);
  border: 1px solid rgba(255,255,255,0.1);
  cursor: pointer;
  transition: all 0.3s;
}

.recipient-tab.active {
  background: var(--terracotta);
  color: var(--white);
  border-color: var(--terracotta);
}

.recipient-tab:hover:not(.active) {
  border-color: rgba(255,255,255,0.3);
  color: rgba(255,255,255,0.8);
}

.recipient-content {
  display: none;
}

.recipient-content.active {
  display: block;
}

.recipient-content p {
  font-size: 0.95rem;
  color: rgba(255,255,255,0.6);
  line-height: 1.8;
}

@media (max-width: 768px) {
  .recipients-split { grid-template-columns: 1fr; }
  .recipients-left { position: static; }
}

/* ================================================================
   FOOTER
   ================================================================ */
.site-footer {
  border-top: 1px solid rgba(255,255,255,0.06);
  padding: 4rem 0 2rem;
}

.footer-grid {
  display: grid;
  grid-template-columns: 2fr repeat(3, 1fr);
  gap: 3rem;
  margin-bottom: 3rem;
}

.footer-col__title {
  font-family: var(--font-bold);
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--white);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 1rem;
}

.footer-col a {
  display: block;
  font-size: 0.85rem;
  color: rgba(255,255,255,0.45);
  padding: 0.25rem 0;
  transition: color 0.3s;
}
.footer-col a:hover { color: var(--white); }

.footer-newsletter {
  display: flex;
  gap: 0.5rem;
  margin-top: 1rem;
}

.footer-newsletter input {
  flex: 1;
  padding: 0.75rem 1rem;
  border-radius: var(--radius-pill);
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05);
  color: var(--white);
  font-size: 0.85rem;
  outline: none;
}

.footer-newsletter input::placeholder { color: rgba(255,255,255,0.3); }

.footer-copyright {
  text-align: center;
  font-size: 0.75rem;
  color: rgba(255,255,255,0.3);
  border-top: 1px solid rgba(255,255,255,0.06);
  padding-top: 2rem;
}

@media (max-width: 768px) {
  .footer-grid { grid-template-columns: 1fr 1fr; }
}

/* ================================================================
   COLLECTION PAGE
   ================================================================ */
.breadcrumbs {
  font-size: 0.8rem;
  color: rgba(255,255,255,0.4);
  margin-bottom: 1.5rem;
}
.breadcrumbs a { color: rgba(255,255,255,0.4); transition: color 0.3s; }
.breadcrumbs a:hover { color: var(--white); }
.breadcrumbs span { color: rgba(255,255,255,0.6); }

.filter-pills {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-bottom: 2rem;
}

.filter-pill {
  padding: 0.5rem 1.25rem;
  border-radius: var(--radius-pill);
  font-family: var(--font-bold);
  font-weight: 600;
  font-size: 0.8rem;
  color: rgba(255,255,255,0.5);
  border: 1px solid rgba(255,255,255,0.1);
  cursor: pointer;
  transition: all 0.3s;
}

.filter-pill.active {
  background: var(--terracotta);
  color: var(--white);
  border-color: var(--terracotta);
}

.filter-pill:hover:not(.active) {
  border-color: rgba(255,255,255,0.3);
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.5rem;
}

.product-card {
  padding: 0;
  overflow: hidden;
  cursor: pointer;
  position: relative;
}

.product-card__image-wrap {
  position: relative;
  overflow: hidden;
  aspect-ratio: 4/3;
}

.product-card__image-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s;
}

.product-card:hover .product-card__image-wrap img {
  transform: scale(1.05);
}

.product-card__sold-out-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}

.product-card__sold-out-text {
  font-family: var(--font-bold);
  font-weight: 800;
  font-size: 1rem;
  color: var(--white);
  text-transform: uppercase;
  letter-spacing: 0.15em;
  transform: rotate(-5deg);
  border: 2px solid var(--white);
  padding: 0.5rem 1.5rem;
}

.product-card__badge {
  position: absolute;
  top: 0.75rem;
  left: 0.75rem;
  background: var(--chaos-red);
  color: var(--white);
  font-family: var(--font-bold);
  font-weight: 700;
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding: 0.25rem 0.75rem;
  border-radius: var(--radius-pill);
  z-index: 3;
}

.product-card__badge--premium { background: var(--purple); }

.product-card__body { padding: 1.25rem; }

.product-card__category {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--terracotta);
  font-weight: 600;
  margin-bottom: 0.25rem;
}

.product-card__name {
  font-family: var(--font-bold);
  font-weight: 700;
  font-size: 1rem;
  color: var(--white);
  margin-bottom: 0.5rem;
}

.product-card__price {
  font-family: var(--font-bold);
  font-weight: 700;
  color: var(--terracotta);
  font-size: 1rem;
}

.product-card__price-from {
  font-weight: 400;
  font-size: 0.75rem;
  color: rgba(255,255,255,0.4);
}

@media (max-width: 768px) {
  .product-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 480px) {
  .product-grid { grid-template-columns: 1fr; }
}

/* ================================================================
   PDP — PRODUCT PAGE
   ================================================================ */
.pdp-hero-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 3rem;
  align-items: start;
}

.pdp-gallery {
  position: relative;
}

.pdp-gallery__main {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  border-radius: var(--radius);
  cursor: zoom-in;
}

.pdp-gallery__thumbs {
  display: flex;
  gap: 0.75rem;
  margin-top: 1rem;
}

.pdp-gallery__thumb {
  width: 72px;
  height: 54px;
  object-fit: cover;
  border-radius: 0.5rem;
  cursor: pointer;
  opacity: 0.4;
  border: 2px solid transparent;
  transition: all 0.3s;
}

.pdp-gallery__thumb.active, .pdp-gallery__thumb:hover {
  opacity: 1;
  border-color: var(--terracotta);
}

.pdp-info__badge {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  background: rgba(245,158,11,0.15);
  color: var(--amber);
  font-family: var(--font-bold);
  font-weight: 600;
  font-size: 0.75rem;
  padding: 0.4rem 0.9rem;
  border-radius: var(--radius-pill);
  margin-bottom: 1rem;
}

.pdp-info__headline {
  font-family: var(--font-bold);
  font-weight: 900;
  font-size: clamp(1.75rem, 4vw, 2.75rem);
  color: var(--white);
  line-height: 1.1;
  margin-bottom: 0.5rem;
}

.pdp-info__tagline {
  font-size: 1rem;
  color: var(--terracotta);
  font-weight: 600;
  margin-bottom: 1rem;
}

.pdp-info__price {
  font-family: var(--font-bold);
  font-weight: 800;
  font-size: 2rem;
  color: var(--white);
  margin-bottom: 0.75rem;
}

.pdp-info__desc {
  font-size: 0.95rem;
  color: rgba(255,255,255,0.6);
  line-height: 1.7;
  margin-bottom: 2rem;
}

/* Chaos Meter */
.chaos-meter {
  margin-bottom: 2rem;
}

.chaos-meter__bar {
  height: 6px;
  border-radius: 3px;
  background: rgba(255,255,255,0.08);
  position: relative;
  margin-bottom: 1.5rem;
  overflow: hidden;
}

.chaos-meter__fill {
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--success), var(--warning), var(--terracotta), var(--chaos-red));
  transition: width 0.5s ease;
}

.chaos-meter__labels {
  display: flex;
  justify-content: space-between;
  font-size: 0.7rem;
  color: rgba(255,255,255,0.4);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.variant-cards {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  margin-bottom: 2rem;
}

.variant-card {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1rem 1.25rem;
  border-radius: var(--radius);
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.03);
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
}

.variant-card:hover { border-color: rgba(255,255,255,0.2); }

.variant-card.active {
  border-color: var(--terracotta);
  background: rgba(212,113,78,0.08);
}

.variant-card__radio {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.2);
  flex-shrink: 0;
  position: relative;
}

.variant-card.active .variant-card__radio {
  border-color: var(--terracotta);
}

.variant-card.active .variant-card__radio::after {
  content: '';
  position: absolute;
  width: 10px;
  height: 10px;
  background: var(--terracotta);
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.variant-card__info { flex: 1; }

.variant-card__name {
  font-family: var(--font-bold);
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--white);
}

.variant-card__desc {
  font-size: 0.8rem;
  color: rgba(255,255,255,0.45);
}

.variant-card__price {
  font-family: var(--font-bold);
  font-weight: 700;
  color: var(--terracotta);
  font-size: 1rem;
}

.variant-card__badge {
  position: absolute;
  top: -8px;
  right: 12px;
  background: var(--terracotta);
  color: var(--white);
  font-family: var(--font-bold);
  font-weight: 700;
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 0.2rem 0.6rem;
  border-radius: var(--radius-pill);
}

.variant-card__badge--soldout {
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.4);
}

.variant-card.soldout {
  opacity: 0.4;
  pointer-events: none;
}

/* ATC Section */
.pdp-atc {
  display: flex;
  gap: 0.75rem;
  align-items: center;
  margin-bottom: 2rem;
}

.qty-selector {
  display: flex;
  align-items: center;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: var(--radius-pill);
  overflow: hidden;
}

.qty-selector button {
  width: 40px;
  height: 44px;
  color: var(--white);
  font-size: 1.1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}

.qty-selector button:hover { background: rgba(255,255,255,0.1); }

.qty-selector__value {
  width: 36px;
  text-align: center;
  font-family: var(--font-bold);
  font-weight: 700;
  color: var(--white);
  font-size: 0.95rem;
}

/* Trust badges below ATC */
.pdp-trust-badges {
  display: flex;
  gap: 1.5rem;
  margin-bottom: 2rem;
  flex-wrap: wrap;
}

.pdp-trust-badge {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.8rem;
  color: rgba(255,255,255,0.5);
}

.pdp-trust-badge svg {
  width: 16px;
  height: 16px;
  stroke: var(--success);
  fill: none;
  stroke-width: 2;
}

@media (max-width: 768px) {
  .pdp-hero-grid { grid-template-columns: 1fr; }
}

/* Sticky ATC */
.sticky-atc {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(26,26,26,0.95);
  backdrop-filter: blur(16px);
  border-top: 1px solid rgba(255,255,255,0.08);
  padding: 0.75rem 1.5rem;
  z-index: 90;
  transform: translateY(100%);
  transition: transform 0.3s ease;
}

.sticky-atc.visible { transform: translateY(0); }

.sticky-atc__inner {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.sticky-atc__info {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.sticky-atc__name {
  font-family: var(--font-bold);
  font-weight: 700;
  color: var(--white);
  font-size: 0.9rem;
}

.sticky-atc__variant {
  font-size: 0.8rem;
  color: rgba(255,255,255,0.5);
}

.sticky-atc__price {
  font-family: var(--font-bold);
  font-weight: 700;
  color: var(--terracotta);
}

/* Chat Bubbles */
.chat-bubbles {
  max-width: 480px;
  margin: 0 auto;
}

.chat-bubble {
  padding: 1rem 1.25rem;
  border-radius: 1.25rem;
  margin-bottom: 0.75rem;
  font-size: 0.95rem;
  line-height: 1.5;
  opacity: 0;
  transform: translateY(15px) scale(0.95);
  transition: all 0.4s ease;
  max-width: 85%;
}

.chat-bubble.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.chat-bubble--received {
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.85);
  border-bottom-left-radius: 0.25rem;
}

.chat-bubble--sent {
  background: linear-gradient(135deg, var(--terracotta), var(--terracotta-hover));
  color: var(--white);
  border-bottom-right-radius: 0.25rem;
  margin-left: auto;
}

.chat-typing {
  display: flex;
  gap: 4px;
  padding: 0.75rem 1rem;
  background: rgba(255,255,255,0.05);
  border-radius: 1rem;
  width: fit-content;
  opacity: 0;
  transition: opacity 0.3s;
}

.chat-typing.visible { opacity: 1; }

.chat-typing__dot {
  width: 6px;
  height: 6px;
  background: rgba(255,255,255,0.3);
  border-radius: 50%;
  animation: typingDot 1.4s ease-in-out infinite;
}

.chat-typing__dot:nth-child(2) { animation-delay: 0.2s; }
.chat-typing__dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingDot {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
  30% { transform: translateY(-4px); opacity: 0.8; }
}

/* Value Props (WIIFM) */
.wiifm-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3rem;
  align-items: center;
}

.wiifm-list {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.wiifm-item {
  display: flex;
  gap: 1rem;
  align-items: start;
}

.wiifm-item__icon {
  font-size: 1.5rem;
  flex-shrink: 0;
}

.wiifm-item__title {
  font-family: var(--font-bold);
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--white);
  margin-bottom: 0.15rem;
}

.wiifm-item__desc {
  font-size: 0.85rem;
  color: rgba(255,255,255,0.5);
}

@media (max-width: 768px) {
  .wiifm-split { grid-template-columns: 1fr; }
}

/* Sign For It comparison */
.upgrade-comparison {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
}

.upgrade-card {
  padding: 2rem;
  text-align: center;
}

.upgrade-card--standard { border-color: rgba(255,255,255,0.06); }

.upgrade-card--premium {
  border-color: rgba(212,113,78,0.4);
  background: rgba(212,113,78,0.08);
}

.upgrade-card__label {
  font-family: var(--font-bold);
  font-weight: 700;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  margin-bottom: 1rem;
}

.upgrade-card--standard .upgrade-card__label { color: rgba(255,255,255,0.4); }
.upgrade-card--premium .upgrade-card__label { color: var(--terracotta); }

.upgrade-card__title {
  font-family: var(--font-bold);
  font-weight: 800;
  font-size: 1.25rem;
  color: var(--white);
  margin-bottom: 0.75rem;
}

.upgrade-card__desc {
  font-size: 0.85rem;
  color: rgba(255,255,255,0.5);
  line-height: 1.7;
  margin-bottom: 1.25rem;
}

.upgrade-card__price {
  font-family: var(--font-bold);
  font-weight: 800;
  font-size: 1.5rem;
  color: var(--white);
}

@media (max-width: 768px) {
  .upgrade-comparison { grid-template-columns: 1fr; }
}

/* Occasions Strip */
.occasions-strip {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  justify-content: center;
}

.occasion-pill {
  padding: 0.5rem 1.25rem;
  border-radius: var(--radius-pill);
  font-size: 0.8rem;
  color: rgba(255,255,255,0.6);
  border: 1px solid rgba(255,255,255,0.08);
  font-weight: 500;
}

/* Cross-sells */
.crosssell-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.5rem;
}

@media (max-width: 768px) {
  .crosssell-grid { grid-template-columns: 1fr; }
}

/* Lightbox */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  cursor: zoom-out;
}

.lightbox.open { display: flex; }

.lightbox img {
  max-width: 90vw;
  max-height: 90vh;
  border-radius: var(--radius);
}

.lightbox__close {
  position: absolute;
  top: 1.5rem;
  right: 1.5rem;
  color: var(--white);
  font-size: 2rem;
  cursor: pointer;
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ================================================================
   CART DRAWER
   ================================================================ */
.cart-toggle {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--white);
  transition: all 0.3s;
}
.cart-toggle:hover {
  background: rgba(255,255,255,0.12);
  border-color: rgba(212,113,78,0.5);
}
.cart-toggle svg {
  width: 20px;
  height: 20px;
  stroke: var(--white);
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.cart-toggle__badge {
  position: absolute;
  top: -4px;
  right: -4px;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: 100px;
  background: var(--chaos-red);
  color: var(--white);
  font-family: var(--font-bold);
  font-weight: 700;
  font-size: 0.7rem;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 10px rgba(220,38,38,0.6);
  transform: scale(0);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.cart-toggle__badge.visible { transform: scale(1); }
.cart-toggle__badge.pulse { animation: badgePulse 0.6s ease; }
@keyframes badgePulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.4); background: var(--terracotta); }
  100% { transform: scale(1); }
}

/* Overlay */
.cart-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.cart-overlay.open {
  opacity: 1;
  pointer-events: auto;
}

/* Drawer panel */
.cart-drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: 420px;
  max-width: 100vw;
  background: linear-gradient(180deg, #1a1a1a 0%, #2A1512 100%);
  border-left: 1px solid rgba(212,113,78,0.2);
  box-shadow: -20px 0 60px rgba(0,0,0,0.6);
  z-index: 210;
  transform: translateX(100%);
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.cart-drawer.open { transform: translateX(0); }
.cart-drawer::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    -45deg,
    transparent,
    transparent 40px,
    rgba(255,255,255,0.015) 40px,
    rgba(255,255,255,0.015) 42px
  );
  pointer-events: none;
}
.cart-drawer > * { position: relative; z-index: 1; }

@media (max-width: 480px) {
  .cart-drawer { width: 100vw; }
}

/* Drawer header */
.cart-drawer__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  flex-shrink: 0;
}
.cart-drawer__title {
  font-family: var(--font-bold);
  font-weight: 800;
  font-size: 1.1rem;
  color: var(--white);
  letter-spacing: 0.02em;
}
.cart-drawer__title .count {
  color: var(--terracotta);
  margin-left: 0.35rem;
}
.cart-drawer__close {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.6);
  transition: all 0.2s;
  background: rgba(255,255,255,0.04);
}
.cart-drawer__close:hover {
  color: var(--white);
  background: rgba(255,255,255,0.1);
}
.cart-drawer__close svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
}

/* Free shipping bar */
.cart-shipping-bar {
  padding: 0.75rem 1.5rem;
  background: linear-gradient(90deg, rgba(91,140,90,0.15), rgba(212,113,78,0.1));
  border-bottom: 1px solid rgba(255,255,255,0.05);
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.8rem;
  color: rgba(255,255,255,0.85);
  font-weight: 500;
  flex-shrink: 0;
}
.cart-shipping-bar__icon { font-size: 1rem; }

/* Drawer body (scrollable) */
.cart-drawer__body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 1rem 1.5rem;
}

/* Dark scrollbar */
.cart-drawer__body::-webkit-scrollbar { width: 6px; }
.cart-drawer__body::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
.cart-drawer__body::-webkit-scrollbar-thumb { background: rgba(212,113,78,0.3); border-radius: 3px; }
.cart-drawer__body::-webkit-scrollbar-thumb:hover { background: rgba(212,113,78,0.5); }
.cart-drawer__body { scrollbar-width: thin; scrollbar-color: rgba(212,113,78,0.3) transparent; }

/* Empty state */
.cart-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 3rem 1.5rem;
  min-height: 60vh;
}
.cart-empty__icon {
  font-size: 3.5rem;
  margin-bottom: 1rem;
  opacity: 0.5;
}
.cart-empty__title {
  font-family: var(--font-bold);
  font-weight: 800;
  font-size: 1.25rem;
  color: var(--white);
  margin-bottom: 0.5rem;
}
.cart-empty__desc {
  font-size: 0.9rem;
  color: rgba(255,255,255,0.5);
  margin-bottom: 2rem;
  line-height: 1.6;
}

/* Line item */
.cart-line {
  display: flex;
  gap: 0.85rem;
  padding: 1rem 0;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  position: relative;
}
.cart-line:last-child { border-bottom: none; }

.cart-line__image {
  width: 80px;
  height: 80px;
  border-radius: 0.75rem;
  object-fit: cover;
  flex-shrink: 0;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
}

.cart-line__info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.cart-line__name {
  font-family: var(--font-bold);
  font-weight: 700;
  font-size: 0.9rem;
  color: var(--white);
  line-height: 1.3;
  margin-bottom: 0.15rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cart-line__variant {
  font-size: 0.75rem;
  color: rgba(255,255,255,0.45);
  margin-bottom: 0.4rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cart-line__price {
  font-family: var(--font-bold);
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--terracotta);
  margin-bottom: 0.5rem;
}
.cart-line__price .per-unit {
  color: rgba(255,255,255,0.4);
  font-weight: 400;
  font-size: 0.7rem;
  margin-left: 0.25rem;
}

.cart-line__controls {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-top: auto;
}

.cart-line__qty {
  display: flex;
  align-items: center;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: var(--radius-pill);
  overflow: hidden;
  height: 32px;
}
.cart-line__qty button {
  width: 28px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--white);
  font-size: 0.95rem;
  transition: background 0.2s;
}
.cart-line__qty button:hover:not(:disabled) { background: rgba(255,255,255,0.08); }
.cart-line__qty button:disabled { opacity: 0.4; cursor: not-allowed; }
.cart-line__qty-value {
  min-width: 28px;
  text-align: center;
  font-family: var(--font-bold);
  font-weight: 600;
  font-size: 0.8rem;
  color: var(--white);
}

.cart-line__remove {
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.4);
  border-radius: 50%;
  transition: all 0.2s;
}
.cart-line__remove:hover {
  color: var(--chaos-red);
  background: rgba(220,38,38,0.1);
}
.cart-line__remove svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.cart-line__loading {
  position: absolute;
  inset: 0;
  background: rgba(26,26,26,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
}
.cart-line__loading.active { opacity: 1; }
.cart-line__loading::after {
  content: '';
  width: 20px;
  height: 20px;
  border: 2px solid rgba(212,113,78,0.3);
  border-top-color: var(--terracotta);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.cart-line__total {
  font-family: var(--font-bold);
  font-weight: 700;
  color: var(--white);
  font-size: 0.9rem;
  flex-shrink: 0;
  align-self: flex-start;
}

/* Upsell bundles */
.cart-upsells {
  margin-top: 1.25rem;
  padding-top: 1.25rem;
  border-top: 1px solid rgba(255,255,255,0.06);
}
.cart-upsells__title {
  font-family: var(--font-bold);
  font-weight: 700;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: rgba(255,255,255,0.5);
  margin-bottom: 0.75rem;
}
.cart-upsell {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.75rem;
  border-radius: 0.75rem;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.03);
  margin-bottom: 0.5rem;
  transition: all 0.3s;
  position: relative;
  cursor: pointer;
}
.cart-upsell:hover {
  border-color: rgba(212,113,78,0.4);
  background: rgba(212,113,78,0.05);
  transform: translateY(-1px);
}
.cart-upsell__img {
  width: 50px;
  height: 50px;
  border-radius: 0.5rem;
  object-fit: cover;
  flex-shrink: 0;
  background: rgba(255,255,255,0.05);
}
.cart-upsell__info { flex: 1; min-width: 0; }
.cart-upsell__name {
  font-family: var(--font-bold);
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--white);
  margin-bottom: 0.15rem;
}
.cart-upsell__desc {
  font-size: 0.7rem;
  color: rgba(255,255,255,0.45);
  line-height: 1.4;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
}
.cart-upsell__save {
  display: inline-block;
  margin-top: 0.25rem;
  font-family: var(--font-bold);
  font-weight: 700;
  font-size: 0.65rem;
  color: var(--success);
  background: rgba(91,140,90,0.15);
  padding: 0.15rem 0.5rem;
  border-radius: var(--radius-pill);
}
.cart-upsell__badge {
  position: absolute;
  top: -6px;
  right: 10px;
  background: var(--terracotta);
  color: var(--white);
  font-family: var(--font-bold);
  font-weight: 700;
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 0.12rem 0.5rem;
  border-radius: var(--radius-pill);
}

/* Drawer footer */
.cart-drawer__footer {
  flex-shrink: 0;
  padding: 1rem 1.5rem 1.25rem;
  border-top: 1px solid rgba(255,255,255,0.08);
  background: rgba(0,0,0,0.25);
}

.cart-summary {
  margin-bottom: 0.85rem;
}
.cart-summary__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.85rem;
  padding: 0.25rem 0;
  color: rgba(255,255,255,0.6);
}
.cart-summary__row--subtotal {
  font-family: var(--font-bold);
  font-weight: 800;
  font-size: 1.1rem;
  color: var(--white);
  padding-bottom: 0.5rem;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  margin-bottom: 0.5rem;
}
.cart-summary__row .free { color: var(--success); font-weight: 600; }
.cart-summary__taxes { font-size: 0.7rem; color: rgba(255,255,255,0.4); margin-top: 0.25rem; }

.cart-checkout {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  width: 100%;
  padding: 1rem 1.25rem;
  border-radius: var(--radius-pill);
  font-family: var(--font-bold);
  font-weight: 800;
  font-size: 0.95rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--white);
  background: linear-gradient(135deg, var(--terracotta), var(--chaos-red));
  box-shadow: 0 0 20px rgba(212,113,78,0.4);
  animation: ctaPulse 2.5s ease-in-out infinite;
  transition: transform 0.2s;
}
.cart-checkout:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(212,113,78,0.6); }
.cart-checkout:active { transform: translateY(0); }

.cart-trust-row {
  display: flex;
  justify-content: space-around;
  margin-top: 0.75rem;
  padding-top: 0.75rem;
  border-top: 1px solid rgba(255,255,255,0.05);
}
.cart-trust-item {
  display: flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.7rem;
  color: rgba(255,255,255,0.5);
}
.cart-trust-item .icon { font-size: 0.85rem; }

/* Toast */
.toast {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%) translateY(200%);
  background: linear-gradient(135deg, var(--terracotta), var(--chaos-red));
  color: var(--white);
  padding: 0.9rem 1.5rem;
  border-radius: var(--radius-pill);
  font-family: var(--font-bold);
  font-weight: 700;
  font-size: 0.85rem;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 30px rgba(212,113,78,0.4);
  z-index: 300;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.toast.visible { transform: translateX(-50%) translateY(0); }
.toast__icon {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
}

/* ATC button success state */
.btn.atc-success {
  background: var(--success) !important;
  animation: none !important;
  pointer-events: none;
}
.btn.atc-success::before { content: '✓ '; }

/* ================================================================
   UTILITY
   ================================================================ */
.text-center { text-align: center; }
.mt-1 { margin-top: 0.5rem; }
.mt-2 { margin-top: 1rem; }
.mt-3 { margin-top: 1.5rem; }
.mt-4 { margin-top: 2rem; }
.mb-1 { margin-bottom: 0.5rem; }
.mb-2 { margin-bottom: 1rem; }
.mb-3 { margin-bottom: 1.5rem; }
.mb-4 { margin-bottom: 2rem; }
.gap-1 { gap: 0.5rem; }
.gap-2 { gap: 1rem; }
.hidden { display: none !important; }

/* ================================================================
   QUIZ PAGE
   ================================================================ */
.quiz-wrap {
  min-height: calc(100vh - 200px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 3rem 1.5rem;
}

.quiz-card {
  width: 100%;
  max-width: 760px;
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  border-radius: calc(var(--radius) * 1.25);
  padding: clamp(1.5rem, 4vw, 3rem);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 60px rgba(212,113,78,0.06);
  position: relative;
  overflow: hidden;
}
.quiz-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 20% 0%, rgba(212,113,78,0.08), transparent 55%),
              radial-gradient(circle at 80% 100%, rgba(220,38,38,0.06), transparent 50%);
  pointer-events: none;
}

.quiz-progress {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1.5rem;
  position: relative;
}
.quiz-progress__label {
  font-family: var(--font-bold);
  font-weight: 700;
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--terracotta);
}
.quiz-progress__count {
  font-family: var(--font-bold);
  font-weight: 600;
  font-size: 0.75rem;
  color: rgba(255,255,255,0.5);
}
.quiz-progress__bar {
  flex: 1;
  height: 6px;
  background: rgba(255,255,255,0.08);
  border-radius: var(--radius-pill);
  overflow: hidden;
}
.quiz-progress__fill {
  height: 100%;
  background: linear-gradient(90deg, var(--terracotta), var(--chaos-red));
  border-radius: var(--radius-pill);
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 0 12px rgba(212,113,78,0.6);
}

.quiz-question-container {
  position: relative;
  min-height: 360px;
}

.quiz-question {
  position: relative;
  opacity: 0;
  transform: translateX(30px);
  transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  pointer-events: none;
}
.quiz-question.active {
  opacity: 1;
  transform: translateX(0);
  pointer-events: auto;
}
.quiz-question.exit {
  opacity: 0;
  transform: translateX(-30px);
  pointer-events: none;
}

.quiz-question__kicker {
  font-family: var(--font-bold);
  font-weight: 700;
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--chaos-red);
  display: inline-block;
  margin-bottom: 0.5rem;
}
.quiz-question__title {
  font-family: var(--font-bold);
  font-weight: 900;
  color: var(--white);
  font-size: clamp(1.5rem, 4vw, 2.25rem);
  line-height: 1.15;
  margin-bottom: 1.75rem;
  text-shadow: 2px 4px 20px rgba(0,0,0,0.4);
  transform: rotate(-0.5deg);
}

.quiz-answers {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
  gap: 0.85rem;
}

.quiz-answer {
  text-align: left;
  padding: 1.2rem 1.3rem;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius);
  color: rgba(255,255,255,0.85);
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  align-items: center;
  gap: 0.85rem;
  position: relative;
  overflow: hidden;
}
.quiz-answer::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(212,113,78,0.15), rgba(220,38,38,0.1));
  opacity: 0;
  transition: opacity 0.25s;
  pointer-events: none;
}
.quiz-answer:hover {
  border-color: rgba(212,113,78,0.5);
  background: rgba(255,255,255,0.07);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(212,113,78,0.15);
}
.quiz-answer:hover::before { opacity: 1; }
.quiz-answer.selected {
  border-color: var(--terracotta);
  background: rgba(212,113,78,0.18);
  box-shadow: 0 0 24px rgba(212,113,78,0.35);
}
.quiz-answer__index {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-bold);
  font-weight: 700;
  font-size: 0.8rem;
  color: rgba(255,255,255,0.6);
  transition: all 0.25s;
  position: relative;
  z-index: 1;
}
.quiz-answer:hover .quiz-answer__index {
  background: var(--terracotta);
  color: var(--white);
}
.quiz-answer.selected .quiz-answer__index {
  background: var(--terracotta);
  color: var(--white);
}
.quiz-answer__label { position: relative; z-index: 1; }

.quiz-back {
  margin-top: 1.5rem;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-family: var(--font-body);
  font-size: 0.85rem;
  color: rgba(255,255,255,0.5);
  cursor: pointer;
  background: none;
  border: none;
  padding: 0.5rem 0;
  transition: color 0.2s;
}
.quiz-back:hover { color: var(--white); }
.quiz-back:disabled { opacity: 0.3; cursor: not-allowed; }

/* Quiz result screen */
.quiz-result {
  opacity: 0;
  transform: scale(0.96);
  transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}
.quiz-result.visible { opacity: 1; transform: scale(1); }

.quiz-result__intro {
  text-align: center;
  margin-bottom: 1.75rem;
}
.quiz-result__kicker {
  font-family: var(--font-bold);
  font-weight: 700;
  font-size: 0.75rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  background: linear-gradient(90deg, var(--terracotta), var(--chaos-red));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: var(--terracotta);
  display: inline-block;
  margin-bottom: 0.75rem;
}
.quiz-result__title {
  font-family: var(--font-bold);
  font-weight: 900;
  color: var(--white);
  font-size: clamp(1.75rem, 4.5vw, 2.75rem);
  line-height: 1.1;
  margin-bottom: 0.5rem;
  text-shadow: 2px 4px 20px rgba(0,0,0,0.5);
  transform: rotate(-0.75deg);
}
.quiz-result__subtitle {
  color: rgba(255,255,255,0.6);
  font-size: 0.95rem;
}

.quiz-result__product {
  display: grid;
  grid-template-columns: 180px 1fr;
  gap: 1.5rem;
  align-items: center;
  padding: 1.5rem;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(212,113,78,0.3);
  border-radius: var(--radius);
  margin-bottom: 1.5rem;
  position: relative;
}
@media (max-width: 560px) {
  .quiz-result__product {
    grid-template-columns: 1fr;
    text-align: center;
  }
}
.quiz-result__image {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: calc(var(--radius) * 0.75);
  background: rgba(255,255,255,0.02);
}
.quiz-result__product-name {
  font-family: var(--font-bold);
  font-weight: 800;
  font-size: 1.3rem;
  color: var(--white);
  margin-bottom: 0.35rem;
}
.quiz-result__variant {
  font-family: var(--font-bold);
  font-weight: 600;
  font-size: 0.75rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--terracotta);
  margin-bottom: 0.5rem;
}
.quiz-result__desc {
  color: rgba(255,255,255,0.65);
  font-size: 0.9rem;
  line-height: 1.55;
  margin-bottom: 0.75rem;
}
.quiz-result__price {
  font-family: var(--font-bold);
  font-weight: 800;
  font-size: 1.5rem;
  color: var(--white);
}

.quiz-result__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  justify-content: center;
}

/* ================================================================
   INFO PAGES (About, FAQ, Shipping, Track, Privacy, Terms, 404)
   ================================================================ */
.info-page {
  padding: 3rem 0 5rem;
  min-height: calc(100vh - 200px);
}

.info-page__wrap {
  max-width: 680px;
  margin: 0 auto;
}

.info-page__wrap--wide { max-width: 760px; }
.info-page__wrap--narrow { max-width: 500px; }

.info-page__header {
  text-align: center;
  margin-bottom: 3rem;
}

.info-page__h1 {
  font-family: var(--font-bold);
  font-weight: 900;
  color: var(--white);
  font-size: clamp(2rem, 5vw, 3.25rem);
  line-height: 1.08;
  margin-bottom: 0.75rem;
  text-shadow: 2px 4px 20px rgba(0,0,0,0.5);
  transform: rotate(-1deg);
}

.info-page__subtitle {
  color: rgba(255,255,255,0.55);
  font-size: 0.95rem;
  letter-spacing: 0.05em;
}

.info-card {
  padding: clamp(1.5rem, 3.5vw, 2.5rem);
  margin-bottom: 1.5rem;
  position: relative;
}

.info-card--highlight {
  border-color: rgba(212,113,78,0.35);
  background: linear-gradient(135deg, rgba(212,113,78,0.12), rgba(220,38,38,0.06));
  box-shadow: 0 0 30px rgba(212,113,78,0.1);
}

.info-card__h2 {
  font-family: var(--font-bold);
  font-weight: 800;
  color: var(--white);
  font-size: 1.4rem;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  line-height: 1.2;
}

.info-card__h2-icon {
  width: 40px;

function formatPrice(cents) {
  return '$' + (cents / 100).toFixed(2);
}

function starHtml(count) {
  return '★'.repeat(count) + '☆'.repeat(5 - count);
}

function productImage(product, index) {
  if (!product.images || !product.images[index || 0]) {
    return `data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" fill="%23222"><rect width="400" height="300"/><text x="200" y="155" text-anchor="middle" fill="%23555" font-family="sans-serif" font-size="14">' + product.name + '</text></svg>')}`;
  }
  return IMG + product.images[index || 0];
}

function getProductPrice(product) {
  if (product.variants) {
    const avail = product.variants.filter(v => !v.soldOut);
    if (avail.length === 0) return product.variants[0].price;
    const min = Math.min(...avail.map(v => v.price));
    const max = Math.max(...avail.map(v => v.price));
    return { min, max, from: min !== max };
  }
  return { min: product.price, max: product.price, from: false };
}

function priceDisplay(product) {
  const p = getProductPrice(product);
  if (p.from) return `<span class="product-card__price-from">From </span>${formatPrice(p.min)}`;
  return formatPrice(p.min);
}

function navigate(hash) {
  window.location.hash = hash;

// Recommendation logic — ported from storefront/src/data/quiz.ts
function computeQuizResult(answers) {
  let productId = 'micropeniscure'; // default: gateway prank

  const recipient = answers[1];
  const occasion = answers[2];
  const intensity = answers[3];
  const tolerance = answers[4];

  if (recipient === 'Coworker') {
    productId = 'micropeniscure';
  } else if (recipient === 'Family member') {
    productId = 'bulkcondomdelivery';
  } else if (
    intensity === 'Full nuclear' ||
    tolerance === "They'll never forgive you (and that's the point)"
  ) {
    productId = 'bigassdildos';
  } else if (occasion === 'Bachelor/Bachelorette') {
    productId = 'bigassdildos';
  } else if (tolerance === "They'll die inside (in a good way)") {
    productId = 'vaginalodorhelper';
  }

  const product = PRODUCTS.find(p => p.id === productId);
  if (!product) {
    return { productId: 'micropeniscure', variantIndex: 0 };
  }

  let variantIndex = 0;

  if (intensity === 'They should have to sign for it') {
    const signIdx = product.variants.findIndex(
      v => v.name.toLowerCase().includes('sign for it') && !v.soldOut
    );
    if (signIdx !== -1) variantIndex = signIdx;
  } else if (intensity === 'Full nuclear') {
    // Highest-tier non-sold-out variant (confetti / dildo)
    const premiumIdx = product.variants.findIndex(
      (v, i) => i >= 2 && !v.soldOut
    );
    if (premiumIdx !== -1) {
      variantIndex = premiumIdx;
    } else {
      const signIdx = product.variants.findIndex(
        v => v.name.toLowerCase().includes('sign for it') && !v.soldOut
      );
      if (signIdx !== -1) variantIndex = signIdx;
    }
  }

  return { productId, variantIndex };
}

// Quiz state
let quizAnswers = {};
let quizCurrentQ = 1;

function initQuiz() {
  quizAnswers = {};
  quizCurrentQ = 1;
  updateQuizProgress();
}

function updateQuizProgress() {
  const fill = document.getElementById('quiz-progress-fill');
  const count = document.getElementById('quiz-progress-count');
  if (!fill || !count) return;
  const isResult = quizCurrentQ > QUIZ_QUESTIONS.length;
  const displayIdx = isResult ? QUIZ_QUESTIONS.length : quizCurrentQ;
  fill.style.width = ((displayIdx / QUIZ_QUESTIONS.length) * 100) + '%';
  count.textContent = isResult ? 'Your result' : `${displayIdx} of ${QUIZ_QUESTIONS.length}`;
}

function selectQuizAnswer(questionId, btnEl) {
  const answer = btnEl.dataset.answer;
  quizAnswers[questionId] = answer;

  // Mark selected
  const siblings = btnEl.parentElement.querySelectorAll('.quiz-answer');
  siblings.forEach(b => b.classList.remove('selected'));
  btnEl.classList.add('selected');

  // Auto-advance after short delay so user sees selection state
  setTimeout(() => advanceQuizQuestion(questionId), 350);
}

function advanceQuizQuestion(fromQ) {
  const current = document.getElementById(`quiz-q-${fromQ}`);
  const isLastQ = fromQ === QUIZ_QUESTIONS.length;
  const nextId = isLastQ ? 'result' : (fromQ + 1);
  const next = document.getElementById(`quiz-q-${nextId}`);
  if (!current || !next) return;

  // Ensure next is absolutely positioned during transition
  next.style.position = 'absolute';
  next.style.inset = '0';

  // Exit current
  current.classList.remove('active');
  current.classList.add('exit');

  // Show next
  setTimeout(() => {
    next.classList.remove('exit');
    next.classList.add('active');
    quizCurrentQ = isLastQ ? QUIZ_QUESTIONS.length + 1 : fromQ + 1;
    updateQuizProgress();

    if (isLastQ) {
      renderQuizResult();
    }
  }, 200);
}

function goBackQuizQuestion(currentQ) {
  if (currentQ <= 1) return;
  const current = document.getElementById(`quiz-q-${currentQ}`);
  const prev = document.getElementById(`quiz-q-${currentQ - 1}`);
  if (!current || !prev) return;

  // Clear selection on prev so user can re-choose
  const prevBtns = prev.querySelectorAll('.quiz-answer');
  prevBtns.forEach(b => b.classList.remove('selected'));
  delete quizAnswers[currentQ - 1];

  current.classList.remove('active');
  current.classList.add('exit');
  setTimeout(() => {
    prev.classList.remove('exit');
    prev.classList.add('active');
    quizCurrentQ = currentQ - 1;
    updateQuizProgress();
  }, 200);
}

function renderQuizResult() {
  const body = document.getElementById('quiz-result-body');
  const resultShell = document.getElementById('quiz-q-result');
  if (!body) return;

  const { productId, variantIndex } = computeQuizResult(quizAnswers);
  const product = PRODUCTS.find(p => p.id === productId);
  if (!product) {
    body.innerHTML = '<p>Something went wrong. <a href="#quiz" style="color: var(--terracotta);">Try again</a>.</p>';
    return;
  }

  const variant = product.variants[variantIndex] || product.variants[0];

  body.innerHTML = `
    <div class="quiz-result__intro">
      <span class="quiz-result__kicker">★ Perfect Match ★</span>
      <h2 class="quiz-result__title">We recommend: ${escapeHtml(product.name)}</h2>
      <p class="quiz-result__subtitle">Based on your answers, this one will land exactly how you want it to.</p>
    </div>

    <div class="quiz-result__product">
      <img class="quiz-result__image" src="${productImage(product, 0)}" alt="${escapeHtml(product.name)}">
      <div>
        ${product.variants.length > 1 ? `<div class="quiz-result__variant">${escapeHtml(variant.name)}</div>` : ''}
        <div class="quiz-result__product-name">${escapeHtml(product.name)}</div>
        <p class="quiz-result__desc">${escapeHtml(product.shortDesc)}</p>
        <div class="quiz-result__price">${formatPrice(variant.price)}</div>
      </div>
    </div>

    <div class="quiz-result__actions">
      <a href="#pdp-${product.slug}" class="btn btn--primary btn--large">View This Prank &rarr;</a>
      <button class="btn btn--secondary btn--large" onclick="restartQuiz()">Start Over</button>
    </div>
  `;

  // Trigger entrance animation
  if (resultShell) {
    requestAnimationFrame(() => resultShell.classList.add('visible'));
  }
}

function restartQuiz() {
  // Reset all quiz question DOM state
  QUIZ_QUESTIONS.forEach((q, i) => {
    const el = document.getElementById(`quiz-q-${q.id}`);
    if (!el) return;
    el.classList.remove('active', 'exit');
    if (i === 0) el.classList.add('active');
    const btns = el.querySelectorAll('.quiz-answer');
    btns.forEach(b => b.classList.remove('selected'));
  });

  const resultEl = document.getElementById('quiz-q-result');
  if (resultEl) {
    resultEl.classList.remove('active', 'visible');
    resultEl.classList.add('exit');
  }

  quizAnswers = {};
  quizCurrentQ = 1;
  updateQuizProgress();
}

const KNOWN_ROUTES = new Set(['home', 'collection', 'quiz', 'about', 'faq', 'shipping-returns', 'track', 'privacy', 'terms', 'not-found']);

function getRoute() {
  const hash = window.location.hash.replace('#', '') || 'home';
  if (hash === 'home') return { page: 'home' };
  if (hash === 'collection') return { page: 'collection' };
  if (hash === 'quiz') return { page: 'quiz' };
  if (hash === 'about') return { page: 'about' };
  if (hash === 'faq') return { page: 'faq' };
  if (hash === 'shipping-returns') return { page: 'shipping-returns' };
  if (hash === 'track') return { page: 'track' };
  if (hash === 'privacy') return { page: 'privacy' };
  if (hash === 'terms') return { page: 'terms' };
  if (hash === 'not-found') return { page: 'not-found' };
  if (hash.startsWith('pdp-')) {
    const productId = hash.replace('pdp-', '');
    const exists = PRODUCTS.some(p => p.id === productId);
    return exists ? { page: 'pdp', productId } : { page: 'not-found' };
  }
  return { page: 'not-found' };
}

function render() {
  const route = getRoute();
  const app = document.getElementById('app');

  switch (route.page) {
    case 'home':
      app.innerHTML = renderHomePage();
      break;
    case 'collection':
      app.innerHTML = renderCollectionPage();
      break;
    case 'pdp':
      currentQty = 1;
      app.innerHTML = renderPdpPage(route.productId);
      break;
    case 'quiz':
      app.innerHTML = renderQuizPage();
      initQuiz();
      break;
    case 'about':
      app.innerHTML = renderAboutPage();
      break;
    case 'faq':
      app.innerHTML = renderFaqPage();
      break;
    case 'shipping-returns':
      app.innerHTML = renderShippingReturnsPage();
      break;
    case 'track':
      app.innerHTML = renderTrackPage();
      break;
    case 'privacy':
      app.innerHTML = renderPrivacyPage();
      break;
    case 'terms':
      app.innerHTML = renderTermsPage();
      break;
    case 'not-found':
      app.innerHTML = renderNotFoundPage();
      break;
    default:
      app.innerHTML = renderNotFoundPage();
  }

  window.scrollTo(0, 0);
  initRevealObserver();
  initCounterAnimations();
  initChatBubbles();
  initStickyAtc();
  updateCartBadge(false);
}

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', () => {
  generateConfetti();
  render();
});

// ================================================================
// INTERACTIONS
// ================================================================

// Confetti generator (35 particles)
function generateConfetti() {
  const container = document.getElementById('confetti');
  const colors = ['#D4714E', '#DC2626', '#F59E0B', '#FBBF24', '#7C3AED', '#5B8C5A', '#9F1239'];
  for (let i = 0; i < 35; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-particle';
    const color = colors[Math.floor(Math.random() * colors.length)];
    const size = 4 + Math.random() * 8;
    const left = Math.random() * 100;
    const delay = Math.random() * 15;
    const duration = 8 + Math.random() * 12;
    const shape = Math.random() > 0.5 ? '50%' : '0';
    p.style.cssText = `
      left: ${left}%;
      width: ${size}px;
      height: ${size}px;
      background: ${color};
      border-radius: ${shape};
      animation-duration: ${duration}s;
      animation-delay: -${delay}s;
    `;
    container.appendChild(p);
  }
}

// Scroll reveal with IntersectionObserver
function initRevealObserver() {
  const reveals = document.querySelectorAll('.reveal:not(.is-visible)');
  if (!reveals.length) return;

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

  reveals.forEach(el => observer.observe(el));
}

// Counter animations
function initCounterAnimations() {
  const counters = document.querySelectorAll('.stat-card__value');
  if (!counters.length) return;

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        animateCounter(entry.target);
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.5 });

  counters.forEach(el => observer.observe(el));
}

function animateCounter(el) {
  const target = parseFloat(el.dataset.target);
  const suffix = el.dataset.suffix || '';
  const isDecimal = el.dataset.decimal === 'true';
  const duration = 1500;
  const start = performance.now();

  function update(now) {
    const elapsed = now - start;
    const progress = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    const current = isDecimal ? (target * eased).toFixed(1) : Math.floor(target * eased);
    el.textContent = current + suffix;
    if (progress < 1) requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}

// Chat bubble sequential animation
function initChatBubbles() {
  const bubbles = document.querySelectorAll('.chat-bubble');
  const typing = document.querySelector('.chat-typing');
  if (!bubbles.length) return;

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        bubbles.forEach((bubble, i) => {
          setTimeout(() => bubble.classList.add('visible'), i * 600);
        });
        if (typing) {
          setTimeout(() => typing.classList.add('visible'), bubbles.length * 600 + 400);
        }
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.3 });

  observer.observe(bubbles[0].parentElement);
}

// Sticky ATC
function initStickyAtc() {
  const atcSection = document.getElementById('pdp-atc-section');
  const stickyBar = document.getElementById('sticky-atc');
  if (!atcSection || !stickyBar) return;

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      stickyBar.classList.toggle('visible', !entry.isIntersecting);
    });
  }, { threshold: 0 });

  observer.observe(atcSection);
}

// FAQ toggle
function toggleFaq(btn) {
  const item = btn.parentElement;
  const wasOpen = item.classList.contains('open');
  // Close all in same list
  const list = item.parentElement;
  list.querySelectorAll('.faq-item').forEach(i => i.classList.remove('open'));
  if (!wasOpen) item.classList.add('open');
}

// Variant selector
function selectVariant(card, productId) {
  if (card.classList.contains('soldout')) return;

  const cards = document.querySelectorAll('.variant-card');
  cards.forEach(c => c.classList.remove('active'));
  card.classList.add('active');

  const price = parseInt(card.dataset.price);
  const chaos = parseInt(card.dataset.chaos);
  const name = card.dataset.name;

  const priceEl = document.getElementById('pdp-price');
  const atcPrice = document.getElementById('atc-price');
  const chaosFill = document.getElementById('chaos-fill');
  const stickyPrice = document.getElementById('sticky-price');
  const stickyVariant = document.getElementById('sticky-variant');

  if (priceEl) priceEl.textContent = formatPrice(price);
  if (atcPrice) atcPrice.textContent = formatPrice(price);
  if (chaosFill) chaosFill.style.width = chaos + '%';
  if (stickyPrice) stickyPrice.textContent = formatPrice(price);
  if (stickyVariant) stickyVariant.textContent = name;
}

// Quantity
let currentQty = 1;
function changeQty(delta) {
  currentQty = Math.max(1, Math.min(10, currentQty + delta));
  const el = document.getElementById('qty-value');
  if (el) el.textContent = currentQty;
}

// Gallery thumb switch
function switchThumb(thumbEl, src) {

  if (mainImg) mainImg.src = src;
  document.querySelectorAll('.pdp-gallery__thumb').forEach(t => t.classList.remove('active'));

// Lightbox
function openLightbox(src) {
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lightbox-img');
  img.src = src;
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';

function closeLightbox() {

}

// Recipient tabs
function switchRecipient(id, btn) {
  document.querySelectorAll('.recipient-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.recipient-content').forEach(c => c.classList.remove('active'));
