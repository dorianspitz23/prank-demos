// ================================================================
// CART STATE (localStorage-backed)
// ================================================================
const CART_KEY = 'pd-chaos-cart';

const BUNDLE_UPSELLS = [
  {
    id: 'double-trouble',
    label: 'Double Trouble',
    desc: "2 pranks, because one confused phone call isn't enough.",
    image: 'double-trouble-bundle.png',
    save: 'Save $5',
    popular: true
  },
  {
    id: 'full-send',
    label: 'The Full Send',
    desc: 'Every prank. Every category. One very long week for your friend.',
    image: 'full-send-bundle2.png',
    save: 'Save $15',
    popular: false
  }
];

function loadCart() {
  try {
    const raw = localStorage.getItem(CART_KEY);
    if (!raw) return { lines: [], updatedAt: Date.now() };
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.lines)) return { lines: [], updatedAt: Date.now() };
    return parsed;
  } catch {
    return { lines: [], updatedAt: Date.now() };
  }
}

function saveCart(cart) {
  try {
    cart.updatedAt = Date.now();
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
  } catch {
    // storage quota / disabled — silent fallback
  }
}

function getCount() {
  const cart = loadCart();
  return cart.lines.reduce((sum, l) => sum + l.quantity, 0);
}

function getTotal() {
  const cart = loadCart();
  return cart.lines.reduce((sum, l) => sum + (l.price * l.quantity), 0);
}

function addToCart(line) {
  const cart = loadCart();
  // Merge by variant
  const existing = cart.lines.find(l => l.productId === line.productId && l.variantId === line.variantId);
  if (existing) {
    existing.quantity = Math.min(99, existing.quantity + line.quantity);
  } else {
    cart.lines.push({
      id: `${line.productId}-${line.variantId}-${Date.now()}`,
      productId: line.productId,
      variantId: line.variantId,
      productName: line.productName,
      variantName: line.variantName,
      price: line.price,
      image: line.image,
      quantity: line.quantity
    });
  }
  saveCart(cart);
  updateCartBadge(true);
  renderCartDrawer();
}

function updateQuantity(id, qty) {
  const cart = loadCart();
  const line = cart.lines.find(l => l.id === id);
  if (!line) return;
  if (qty <= 0) {
    cart.lines = cart.lines.filter(l => l.id !== id);
  } else {
    line.quantity = Math.min(99, qty);
  }
  saveCart(cart);
  updateCartBadge(false);
  renderCartDrawer();
}

function removeItem(id) {
  const cart = loadCart();
  cart.lines = cart.lines.filter(l => l.id !== id);
  saveCart(cart);
  updateCartBadge(false);
  renderCartDrawer();
}

// ================================================================
// CART UI
// ================================================================

function updateCartBadge(pulse) {
  const badge = document.getElementById('cart-badge');
  if (!badge) return;
  const count = getCount();
  badge.textContent = count > 99 ? '99+' : count;
  if (count > 0) {
    badge.classList.add('visible');
    if (pulse) {
      badge.classList.remove('pulse');
      // force reflow to restart animation
      void badge.offsetWidth;
      badge.classList.add('pulse');
    }
  } else {
    badge.classList.remove('visible');
  }
}

let cartDrawerPreviousFocus = null;

function openCartDrawer() {
  const overlay = document.getElementById('cart-overlay');
  const drawer = document.getElementById('cart-drawer');
  if (!overlay || !drawer) return;
  cartDrawerPreviousFocus = document.activeElement;
  overlay.classList.add('open');
  drawer.classList.add('open');
  drawer.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  renderCartDrawer();
  // Focus close button
  setTimeout(() => {
    const closeBtn = document.getElementById('cart-close-btn');
    if (closeBtn) closeBtn.focus();
  }, 100);
}

function closeCartDrawer() {
  const overlay = document.getElementById('cart-overlay');
  const drawer = document.getElementById('cart-drawer');
  if (!overlay || !drawer) return;
  overlay.classList.remove('open');
  drawer.classList.remove('open');
  drawer.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  if (cartDrawerPreviousFocus && typeof cartDrawerPreviousFocus.focus === 'function') {
    cartDrawerPreviousFocus.focus();
  }
  cartDrawerPreviousFocus = null;
}

// Escape key + focus trap
document.addEventListener('keydown', (e) => {
  const drawer = document.getElementById('cart-drawer');
  if (!drawer || !drawer.classList.contains('open')) return;

  if (e.key === 'Escape') {
    e.preventDefault();
    closeCartDrawer();
    return;
  }

  if (e.key === 'Tab') {
    const focusable = drawer.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), [tabindex]:not([tabindex="-1"])');
    if (focusable.length === 0) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  }
});

function renderCartDrawer() {
  const body = document.getElementById('cart-body');
  const footer = document.getElementById('cart-footer');
  const countLabel = document.getElementById('cart-drawer-count');
  if (!body || !footer || !countLabel) return;

  const cart = loadCart();
  const count = getCount();
  const total = getTotal();

  countLabel.textContent = count > 0 ? ` (${count})` : '';

  if (cart.lines.length === 0) {
    body.innerHTML = `
      <div class="cart-empty">
        <div class="cart-empty__icon">📦</div>
        <div class="cart-empty__title">Your cart is empty</div>
        <div class="cart-empty__desc">Your friend's mailbox doesn't have to be. 27 pranks waiting — free shipping, zero evidence.</div>
        <button class="btn btn--primary" onclick="closeCartDrawer(); navigate('collection');">Start Shopping</button>
      </div>
    `;
    footer.style.display = 'none';
    return;
  }

  // Line items
  const linesHtml = cart.lines.map(line => `
    <div class="cart-line" data-line-id="${line.id}">
      <img class="cart-line__image" src="${line.image}" alt="${escapeHtml(line.productName)}" onerror="this.src='${productImage({name: line.productName}, 0)}'">
      <div class="cart-line__info">
        <div class="cart-line__name">${escapeHtml(line.productName)}</div>
        <div class="cart-line__variant">${escapeHtml(line.variantName)}</div>
        <div class="cart-line__price">
          ${formatPrice(line.price * line.quantity)}
          ${line.quantity > 1 ? `<span class="per-unit">(${formatPrice(line.price)} each)</span>` : ''}
        </div>
        <div class="cart-line__controls">
          <div class="cart-line__qty">
            <button onclick="handleQtyChange('${line.id}', ${line.quantity - 1}, this)" aria-label="Decrease quantity">−</button>
            <span class="cart-line__qty-value">${line.quantity}</span>
            <button onclick="handleQtyChange('${line.id}', ${line.quantity + 1}, this)" aria-label="Increase quantity">+</button>
          </div>
          <button class="cart-line__remove" onclick="handleRemove('${line.id}')" aria-label="Remove ${escapeHtml(line.productName)}">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
          </button>
        </div>
      </div>
      <div class="cart-line__loading"></div>
    </div>
  `).join('');

  // Bundle upsells
  const upsellsHtml = `
    <div class="cart-upsells">
      <div class="cart-upsells__title">Add more chaos</div>
      ${BUNDLE_UPSELLS.map(b => `
        <div class="cart-upsell" onclick="closeCartDrawer(); navigate('collection');">
          ${b.popular ? `<span class="cart-upsell__badge">Popular</span>` : ''}
          <img class="cart-upsell__img" src="${IMG}${b.image}" alt="${b.label}" onerror="this.style.display='none'">
          <div class="cart-upsell__info">
            <div class="cart-upsell__name">${b.label}</div>
            <div class="cart-upsell__desc">${b.desc}</div>
            <span class="cart-upsell__save">${b.save}</span>
          </div>
        </div>
      `).join('')}
    </div>
  `;

  body.innerHTML = linesHtml + upsellsHtml;

  // Footer
  footer.style.display = 'block';
  footer.innerHTML = `
    <div class="cart-summary">
      <div class="cart-summary__row cart-summary__row--subtotal">
        <span>Subtotal</span>
        <span>${formatPrice(total)}</span>
      </div>
      <div class="cart-summary__row">
        <span>Shipping</span>
        <span class="free">FREE</span>
      </div>
      <div class="cart-summary__taxes">Taxes calculated at checkout</div>
    </div>
    <button class="cart-checkout" onclick="handleCheckout()">
      Proceed to Checkout →
    </button>
    <div class="cart-trust-row">
      <div class="cart-trust-item"><span class="icon">🚚</span> Free Shipping</div>
      <div class="cart-trust-item"><span class="icon">👻</span> Anonymous</div>
      <div class="cart-trust-item"><span class="icon">🛡️</span> 60-Day</div>
    </div>
  `;
}

function handleQtyChange(id, newQty, btnEl) {
  // Show loader on the line
  const lineEl = btnEl.closest('.cart-line');
  const loader = lineEl && lineEl.querySelector('.cart-line__loading');
  if (loader) loader.classList.add('active');
  // Disable both qty buttons on this line
  if (lineEl) lineEl.querySelectorAll('.cart-line__qty button').forEach(b => b.disabled = true);
  setTimeout(() => {
    updateQuantity(id, newQty);
  }, 200);
}

function handleRemove(id) {
  removeItem(id);
}

function handleCheckout() {
  showToast('Checkout opened in new tab', 'ℹ');
}

function showToast(message, icon) {
  const toast = document.getElementById('toast');
  const msg = document.getElementById('toast-msg');
  if (!toast || !msg) return;
  msg.textContent = message;
  const iconEl = toast.querySelector('.toast__icon');
  if (iconEl && icon) iconEl.textContent = icon;
  toast.classList.add('visible');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => {
    toast.classList.remove('visible');
  }, 2500);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ================================================================
// ATC integration with PDP state
// ================================================================

function addToCartFromPdp(productId, btnEl) {
  const product = PRODUCTS.find(p => p.id === productId);
  if (!product) return;

  let variant;
  if (product.variants && product.variants.length > 1) {
    const activeCard = document.querySelector('.variant-card.active');
    if (activeCard) {
      const activeVariantName = activeCard.dataset.name;
      variant = product.variants.find(v => v.name === activeVariantName);
    }
    if (!variant) variant = product.variants.find(v => !v.soldOut) || product.variants[0];
  } else if (product.variants) {
    variant = product.variants[0];
  } else {
    variant = { id: 'default', name: 'Standard', price: product.price };
  }

  if (variant.soldOut) {
    showToast('That variant is sold out', '×');
    return;
  }

  const quantity = currentQty || 1;
  const image = productImage(product, 0);

  addToCart({
    productId: product.id,
    variantId: variant.id,
    productName: product.name,
    variantName: variant.name,
    price: variant.price,
    image: image,
    quantity: quantity
  });

  // Button success animation
  if (btnEl) {
    const originalHtml = btnEl.innerHTML;
    btnEl.classList.add('atc-success');
    btnEl.innerHTML = 'Added to Cart';
    setTimeout(() => {
      btnEl.classList.remove('atc-success');
      btnEl.innerHTML = originalHtml;
    }, 1400);
  }

  // Open drawer after brief delay
  setTimeout(() => openCartDrawer(), 500);
}
