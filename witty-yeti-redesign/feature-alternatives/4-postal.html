<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Feature alt #4 — Postal / USPS Theme</title>
<style>
  *,*::before,*::after { box-sizing: border-box; }
  body { margin: 0; font-family: 'Mont', 'Droid Sans', system-ui, sans-serif; background: #f5f5f5; }

  .orange-band {
    position: relative;
    background: #FF7A18;
    color: #fff;
    padding: 80px 20px;
    overflow: hidden;
  }
  /* Repeating postal-stamp grid as a watermark */
  .orange-band::before {
    content: 'FIRST CLASS MAIL · FIRST CLASS MAIL · FIRST CLASS MAIL · FIRST CLASS MAIL · FIRST CLASS MAIL · FIRST CLASS MAIL · ';
    position: absolute;
    inset: 0;
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 48px;
    letter-spacing: 0.1em;
    line-height: 1.8;
    color: rgba(0,0,0,0.07);
    white-space: pre-wrap;
    word-spacing: 8px;
    overflow: hidden;
    pointer-events: none;
  }
  /* Diagonal "AIR MAIL" stripe top-right corner */
  .orange-band::after {
    content: 'AIR MAIL';
    position: absolute;
    top: 40px;
    right: -80px;
    background: #B62323;
    color: #fff;
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.3em;
    padding: 10px 100px;
    transform: rotate(45deg);
    box-shadow: 0 6px 16px rgba(0,0,0,0.25);
  }
  .inner {
    position: relative;
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1.1fr;
    gap: 50px;
    align-items: center;
    z-index: 1;
  }
  @media (max-width: 820px) { .inner { grid-template-columns: 1fr; } }

  /* Stamp-bordered product frame */
  .img-wrap {
    position: relative;
    aspect-ratio: 1/1;
    max-width: 480px;
    margin: 0 auto;
    background: #FFF4E6;
    padding: 24px;
    /* Perforated stamp edge using radial-gradient mask */
    --n: 14;
    mask:
      radial-gradient(10px at 10px 10px, #0000 98%, #000) -10px -10px / calc(100%/var(--n)) calc(100%/var(--n));
    -webkit-mask:
      radial-gradient(10px at 10px 10px, #0000 98%, #000) -10px -10px / calc(100%/var(--n)) calc(100%/var(--n));
    box-shadow: 0 24px 48px rgba(0,0,0,0.2);
  }
  .img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 12px 16px rgba(0,0,0,0.15));
  }
  .stamp-info {
    position: absolute;
    bottom: 12%;
    left: 12%;
    right: 12%;
    display: flex;
    justify-content: space-between;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: #2D1B0A;
    opacity: 0.5;
    letter-spacing: 0.08em;
  }

  h2 {
    font-size: clamp(40px, 5.5vw, 64px);
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin: 0 0 22px;
  }
  .tracking {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.75);
    margin-bottom: 12px;
  }
  p { color: rgba(255,255,255,0.95); font-size: 17px; line-height: 1.6; max-width: 42ch; margin: 0 0 28px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 18px 36px; border: 2px solid #fff; border-radius: 0;
    background: transparent; color: #fff;
    font-family: 'Courier New', monospace;
    font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; font-size: 14px;
    text-decoration: none;
    transition: all .35s cubic-bezier(.29,.63,.44,1);
  }
  .btn:hover { background: #fff; color: #FF7A18; }
</style>
</head>
<body>
  <section class="orange-band">
    <div class="inner">
      <div class="img-wrap">
        <picture>
          <source srcset="../images/bigassdildos.webp" type="image/webp" />
          <img src="../images/bigassdildos.png" alt="BigAssDildos anonymous prank mail tube" />
        </picture>
        <div class="stamp-info">
          <span>USPS · TUBE-2024</span>
          <span>NO RETURN</span>
        </div>
      </div>
      <div>
        <div class="tracking">TRACKING · 9400 1123 8473 2918 · FIRST CLASS</div>
        <h2>Watch them try<br/>to explain this one.</h2>
        <p>USPS-standard packaging. Their name on the label. A URL the mailman will remember. Signed: not you.</p>
        <a class="btn" href="#">Send one anonymously</a>
      </div>
    </div>
  </section>
</body>
</html>
