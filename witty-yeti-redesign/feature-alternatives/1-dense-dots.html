<style>
  *,*::before,*::after { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Mont', 'Droid Sans', system-ui, sans-serif;
    background: #f5f5f5;
  }
  .orange-band {
    position: relative;
    background: linear-gradient(0deg, #FF6601 0%, #FFB11B 100%);
    color: #fff;
    padding: 80px 20px;
    overflow: hidden;
  }
  /* Dots pattern fills the ENTIRE section (not just image area) */
  .orange-band::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.7) 2px, transparent 2.5px);
    background-size: 14px 14px;
    pointer-events: none;
    z-index: 0;
  }
  /* Bottom swoosh */
  .orange-band::after {
    content: '';
    position: absolute;
    left: -5%; right: -5%;
    bottom: -80px;
    height: 100px;
    background: #fff;
    border-radius: 50%;
    z-index: 1;
  }
  .inner {
    position: relative;
    z-index: 2;
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1.1fr;
    gap: 50px;
    align-items: center;
  }
  @media (max-width: 820px) { .inner { grid-template-columns: 1fr; } }

  /* Product visual w/ big yellow circle behind */
  .img-wrap {
    aspect-ratio: 1/1;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    display: grid;
    place-items: center;
    isolation: isolate;
  }
  .img-wrap::before {
    content: '';
    position: absolute;
    inset: 15%;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #FFD580 0%, #FFBA47 55%, #FFA424 100%);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.18);
    z-index: -1;
  }
  .img-wrap img {
    width: 75%;
    height: auto;
    max-height: 75%;
    object-fit: contain;
    filter: drop-shadow(0 24px 30px rgba(0,0,0,0.28));
    transform: rotate(-4deg);
  }

  h2 {
    font-size: clamp(40px, 5.5vw, 64px);
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin: 0 0 20px;
    color: #fff;
  }
  p {
    color: rgba(255,255,255,0.95);
    font-size: 17px;
    line-height: 1.6;
    max-width: 42ch;
    margin: 0 0 28px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 18px 36px;
    border: 2px solid #fff;
    border-radius: 99px;
    color: #fff;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 15px;
    text-decoration: none;
    transition: all .35s cubic-bezier(.29,.63,.44,1);
  }
  .btn:hover { background: #fff; color: #FF6601; }
