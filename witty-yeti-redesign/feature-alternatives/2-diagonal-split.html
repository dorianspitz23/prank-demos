<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Feature alt #2 — Diagonal Split</title>
<style>
  *,*::before,*::after { box-sizing: border-box; }
  body { margin: 0; font-family: 'Mont', 'Droid Sans', system-ui, sans-serif; background: #f5f5f5; }

  .orange-band {
    position: relative;
    min-height: 620px;
    padding: 80px 20px;
    overflow: hidden;
    /* Diagonal split: cream-yellow on top-left, deep orange bottom-right */
    background: linear-gradient(105deg, #FFE8C4 0%, #FFE8C4 48%, #FF7518 52%, #FF5F00 100%);
    color: #2D1B0A;
  }
  /* Subtle diagonal stripes on the orange side for texture */
  .orange-band::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      105deg,
      transparent 0 32px,
      rgba(0,0,0,0.03) 32px 33px
    );
    pointer-events: none;
  }
  .inner {
    position: relative;
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    align-items: center;
    min-height: 460px;
  }
  @media (max-width: 820px) {
    .inner { grid-template-columns: 1fr; }
    .orange-band { background: linear-gradient(180deg, #FFE8C4 0%, #FFE8C4 45%, #FF7518 55%, #FF5F00 100%); }
  }

  .img-wrap {
    position: relative;
    aspect-ratio: 1/1;
    max-width: 480px;
    margin: 0 auto;
    display: grid;
    place-items: center;
  }
  .img-wrap img {
    width: 100%;
    filter: drop-shadow(0 30px 40px rgba(0,0,0,0.35));
    transform: rotate(-8deg);
    transition: transform .5s ease;
  }
  .img-wrap:hover img { transform: rotate(0) scale(1.03); }

  /* Decorative label badge on the product */
  .badge {
    position: absolute;
    top: 12%;
    right: 6%;
    background: #fff;
    color: #FF5F00;
    padding: 10px 20px;
    border-radius: 99px;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    box-shadow: 0 10px 24px rgba(0,0,0,0.2);
    transform: rotate(6deg);
    z-index: 2;
  }

  .copy { color: #fff; padding-left: 40px; }
  @media (max-width: 820px) { .copy { padding-left: 0; color: #2D1B0A; } }

  .kicker {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #FF5F00;
    background: #fff;
    padding: 6px 14px;
    border-radius: 99px;
    margin-bottom: 20px;
  }
  h2 {
    font-size: clamp(40px, 5.5vw, 68px);
    line-height: 1.02;
    letter-spacing: -0.025em;
    margin: 0 0 22px;
  }
  p { font-size: 17px; line-height: 1.6; max-width: 42ch; margin: 0 0 28px; opacity: 0.92; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 18px 36px; border: 0; border-radius: 99px;
    background: #2D1B0A; color: #fff;
    font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; font-size: 15px;
    text-decoration: none;
    transition: all .35s cubic-bezier(.29,.63,.44,1);
  }
  .btn:hover { background: #fff; color: #FF5F00; transform: translateY(-2px); }
</style>
</head>
<body>
  <section class="orange-band">
    <div class="inner">
      <div class="img-wrap">
        <span class="badge">Bestseller</span>
        <picture>
          <source srcset="../images/bigassdildos.webp" type="image/webp" />
          <img src="../images/bigassdildos.png" alt="BigAssDildos anonymous prank mail tube" />
        </picture>
      </div>
      <div class="copy">
        <span class="kicker">Flagship · Since 2017</span>
        <h2>Watch them try to explain this one.</h2>
        <p>USPS-standard packaging. Their name on the label. A URL the mailman will remember. Signed: not you.</p>
        <a class="btn" href="#">Send one anonymously →</a>
      </div>
    </div>
  </section>
</body>
</html>
