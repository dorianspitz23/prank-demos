  body { margin: 0; font-family: 'Mont', 'Droid Sans', system-ui, sans-serif; background: #f5f5f5; }

  .orange-band {
    position: relative;
    background: radial-gradient(circle at 30% 50%, #FFB63A 0%, #FF7A18 70%);
    color: #fff;
    padding: 100px 20px;
    overflow: hidden;
  }
  .inner {

    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1.1fr;
    gap: 50px;
    align-items: center;
  }
  @media (max-width: 820px) { .inner { grid-template-columns: 1fr; } }

  /* Concentric orbits = stacked circles, each a ring */
  .img-wrap {
    position: relative;
    aspect-ratio: 1/1;
    max-width: 520px;
    margin: 0 auto;
    display: grid;
    place-items: center;
  }
  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.25);
    pointer-events: none;
    animation: spin 20s linear infinite;
  }
  .ring--2 { inset: 8%; border-color: rgba(255,255,255,0.35); animation-duration: 30s; animation-direction: reverse; }
  .ring--3 { inset: 16%; border-color: rgba(255,255,255,0.45); animation-duration: 40s; }
  .ring--4 {
    inset: 24%;
    background: radial-gradient(circle at 50% 45%, #FFD580 0%, #FFBA47 60%, #FFA424 100%);
    border: 0;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.3);
    animation: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Tick marks on the outer ring — like a sundial */
  .ring--1::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 2px dashed rgba(255,255,255,0.35);
  }

  .img-wrap img {
    position: relative;
    z-index: 2;
    width: 70%;
    filter: drop-shadow(0 24px 30px rgba(0,0,0,0.35));
    transform: rotate(-6deg);
  }

  h2 {
    font-size: clamp(40px, 5.5vw, 64px);
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin: 0 0 22px;

  .btn {

    text-decoration: none;
    transition: all .35s cubic-bezier(.29,.63,.44,1);
  }
  .btn:hover { background: #fff; color: #FF7A18; }

  @media (prefers-reduced-motion: reduce) {
